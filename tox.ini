[tox]
envlist = black, compileall, unittest

[testenv]
skip_install = true
deps = -r requirements-dev.txt

[testenv:black]
commands = black --check --diff .

[testenv:compileall]
commands = python -m compileall -q main.py abs_api.py abs_http.py abs_auth.py abs_discovery.py addonxml.py service.py tools/

[testenv:unittest]
commands = python -m unittest discover -s tests -t . -p 'test_*.py'

# No mypy env, deliberately. Run strict over main.py/abs_api.py/service.py and
# it reports ~104 errors, almost all missing annotations across main.py's 1200
# lines. A config relaxed enough to pass today would check nothing, and
# annotating the addon is a change to its behaviour surface, not a CI change —
# so it is not smuggled in under a CI commit.
#
# To add it later, in its own PR: annotate abs_http.py first (it is now the
# smallest module and the only one with no Kodi imports at all, so it is also
# the only one that is unit-testable off a Kodi box), then abs_api.py, adding
# mypy.ini with `files = abs_http.py` and widening module by module.
# script.kofin.lyrics' mypy.ini is the pattern.
